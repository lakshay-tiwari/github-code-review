[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-api"
version = "0.1.0"
description = "FastAPI backend and shared package for Cortex GitHub Codebase RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "pyjwt[crypto]>=2.9.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "sentence-transformers>=3.3.0",
    "qdrant-client>=1.12.0",
    "neo4j>=5.26.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["EXE002"]
